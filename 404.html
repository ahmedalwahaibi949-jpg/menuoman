<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>داين عُمان</title>
<meta name="theme-color" content="#ffffff">
<script>
  // GitHub Pages serves this file for any unknown path. /restaurant/<slug> becomes a Dine Oman
  // restaurant page; the <base> makes every relative link resolve inside /dine-oman/.
  (function () {
    var m = location.pathname.match(/^(.*?\/)restaurant\/[a-z0-9-]+\/?$/i);
    window.__DINE_ROUTE = !!m;
    var root = m ? m[1] : location.pathname.replace(/[^/]*$/, "");
    document.write('<base href="' + root.replace(/"/g, "") + 'dine-oman/">');
  })();
</script>
<script src="js/lang.js"></script>
<link rel="icon" href="app-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="css/do.css">
</head>
<body>
<header class="top"></header>
<main id="page"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script>
<script>
  if (window.__DINE_ROUTE) {
    var s = document.createElement("script"); s.src = "js/restaurant-page.js"; document.body.appendChild(s);
  } else {
    DineUI.chrome();
    document.getElementById("page").innerHTML = '<div class="wrap page"><div class="empty"><b>' + t("الصفحة غير موجودة", "Page not found") + '</b><a class="link" href="restaurants.html">' + t("استكشف المطاعم", "Discover restaurants") + '</a></div></div>';
  }
</script>
</body>
</html>
