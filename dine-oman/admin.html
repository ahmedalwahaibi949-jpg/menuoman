<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin · Dine Oman</title>
<meta name="theme-color" content="#0C3B3A">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="app-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/site-fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Reem+Kufi:wght@500..700&display=swap">
<link rel="stylesheet" href="css/do.css">
<style>
body{visibility:hidden}
body.ok{visibility:visible}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;display:grid;gap:2px;text-decoration:none;color:inherit}
.stat span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--f-display);font-size:30px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1}
.stat.hot{border-color:var(--saffron);background:#FFFBF2}
.layout{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:18px;align-items:start}
.q{display:grid;gap:8px}
.qrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.qrow:hover{border-color:#B9C7C0}
.qrow[aria-current=true]{border-color:var(--teal-2);box-shadow:0 0 0 3px rgba(23,96,91,.12)}
.qrow img{width:44px;height:44px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.qrow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow small{color:var(--muted);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail{overflow:hidden;padding:0;position:sticky;top:88px}
.detail .cv{aspect-ratio:16/7;background:var(--soft)}
.detail .cv img{width:100%;height:100%;object-fit:cover}
.detail .in{padding:22px;display:grid;gap:16px}
.detail .top{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center}
.detail .top img{width:64px;height:64px;border-radius:14px;object-fit:contain;background:#fff;border:1px solid var(--line);margin-top:-44px;box-shadow:var(--shadow)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 18px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.desc{font-size:14.5px;background:var(--soft);border-radius:12px;padding:14px 16px;white-space:pre-wrap}
.sm-btn{padding:8px 12px;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font:500 13.5px var(--f-body);cursor:pointer;color:var(--fg)}
.tabs button[aria-pressed=true]{background:var(--teal);color:var(--sand);border-color:var(--teal)}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}.detail{position:static}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="topbar"></header>
<main class="container dash">
  <nav class="dash-nav" id="nav" aria-label="Admin">
    <div class="who"><span class="avatar" id="av" style="background:var(--ink)"></span><span style="min-width:0"><b id="whoName"></b><small>Super administrator</small></span></div>
    <a href="#overview" data-tab="overview">Overview</a>
    <a href="#applications" data-tab="applications">Applications <i id="nApps" hidden></i></a>
    <a href="#restaurants" data-tab="restaurants">Restaurants</a>
    <a href="#users" data-tab="users">Users <i id="nDel" hidden></i></a>
    <a href="#reviews" data-tab="reviews">Reviews</a>
    <a href="#settings" data-tab="settings">Account settings</a>
  </nav>
  <section class="dash-main" id="main"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/settings.js"></script>
<script>
(async function () {
  const api = DineAPI, U = DineUI, $ = U.$, esc = U.esc, A = api.admin;
  // Redirects anyone who isn't an admin before anything renders. The database refuses their queries regardless.
  let me = await U.requireRole(["admin"]);
  document.body.classList.add("ok");
  await U.chrome({ me });
  $("#whoName").textContent = me.full_name || me.email; $("#av").textContent = U.initials(me.full_name || "Admin");

  async function badges() {
    const [rs, us] = await Promise.all([A.restaurants(), A.users()]);
    const p = rs.filter(r => r.status === "pending").length, d = us.filter(u => u.deletion_requested_at).length;
    $("#nApps").hidden = !p; $("#nApps").textContent = p; $("#nDel").hidden = !d; $("#nDel").textContent = d;
    document.title = (p ? `(${p}) ` : "") + "Admin · Dine Oman";
    return { rs, us };
  }
  const tap2 = (btn, label, fn) => btn.onclick = async () => { if (btn.dataset.sure !== "1") { btn.dataset.sure = "1"; btn.dataset.orig = btn.textContent; btn.textContent = label; setTimeout(() => { btn.dataset.sure = ""; btn.textContent = btn.dataset.orig; }, 4000); return; } btn.disabled = true; try { await fn(); } catch (e) { U.toast(e.message, true); btn.disabled = false; } };

  const views = {
    async overview(el) {
      const { rs, us } = await badges();
      const reviews = await A.reviews();
      const c = s => rs.filter(r => r.status === s).length;
      el.innerHTML = `<header><div><h1>Overview</h1><p class="muted">Everything on Dine Oman at a glance.</p></div></header>
        <div class="stats">
          <a class="stat ${c("pending") ? "hot" : ""}" href="#applications"><span>Pending approval</span><b>${c("pending")}</b></a>
          <a class="stat" href="#restaurants"><span>Live restaurants</span><b>${rs.filter(r => r.published).length}</b></a>
          <a class="stat" href="#users"><span>Customers</span><b>${us.filter(u => u.role === "customer").length}</b></a>
          <a class="stat" href="#users"><span>Owners</span><b>${us.filter(u => u.role === "owner").length}</b></a>
        </div>
        <div class="stats">
          <div class="stat"><span>Awaiting email verification</span><b>${c("awaiting_verification")}</b></div>
          <div class="stat"><span>Rejected</span><b>${c("rejected")}</b></div>
          <a class="stat" href="#reviews"><span>Reviews</span><b>${reviews.length}</b></a>
          <a class="stat ${us.some(u => u.deletion_requested_at) ? "hot" : ""}" href="#users"><span>Deletion requests</span><b>${us.filter(u => u.deletion_requested_at).length}</b></a>
        </div>
        ${c("pending") ? `<div class="alert warn"><b>${c("pending")} application${c("pending") > 1 ? "s" : ""} waiting.</b> <a href="#applications">Review now →</a></div>` : `<div class="alert ok">No applications waiting. You're all caught up.</div>`}`;
    },

    async applications(el, hash) {
      const { rs } = await badges();
      let filter = "pending", current = hash.split("-").slice(1).join("-") || null;
      el.innerHTML = `<header><div><h1>Applications</h1><p class="muted">Approve to publish the restaurant's public page automatically.</p></div>
        <div class="tabs" id="flt">${["pending", "approved", "rejected", "awaiting_verification", "all"].map(s => `<button data-s="${s}" aria-pressed="${s === filter}">${{ pending: "Pending", approved: "Approved", rejected: "Rejected", awaiting_verification: "Unverified", all: "All" }[s]} <span class="muted">${s === "all" ? rs.length : rs.filter(r => r.status === s).length}</span></button>`).join("")}</div></header>
        <div class="layout"><div class="q" id="q"></div><div class="card detail" id="det"><div class="empty">Select an application to review it.</div></div></div>`;
      $("#flt", el).onclick = e => { const b = e.target.closest("button"); if (!b) return; filter = b.dataset.s; el.querySelectorAll("#flt button").forEach(x => x.setAttribute("aria-pressed", x === b)); list(); };
      function list() {
        const rows = rs.filter(r => filter === "all" || r.status === filter);
        $("#q", el).innerHTML = rows.length ? rows.map(r => `<button class="qrow" data-id="${r.id}" aria-current="${r.id === current}"><img src="${esc(r.logo_url)}" alt=""><span style="min-width:0"><b>${esc(r.name)}</b><small>${esc(r.reference)} · ${esc(r.city)} · ${U.dateTime(r.submitted_at || r.created_at)}</small></span>${U.statusBadge(r)}</button>`).join("")
          : `<div class="card empty">${filter === "pending" ? "<b>Nothing waiting</b><span>New applications appear here and you'll get an email.</span>" : "Nothing here."}</div>`;
        $("#q", el).querySelectorAll(".qrow").forEach(b => b.onclick = () => { current = b.dataset.id; list(); detail(rs.find(r => r.id === current)); if (innerWidth < 1000) $("#det", el).scrollIntoView({ behavior: "smooth" }); });
      }
      function detail(r) {
        const o = r.owner || {};
        $("#det", el).innerHTML = `<div class="cv"><img src="${esc(r.cover_url)}" alt="Cover"></div><div class="in">
          <div class="top"><img src="${esc(r.logo_url)}" alt="Logo"><div style="min-width:0"><h2>${esc(r.name)}</h2><p class="small muted">${esc(r.reference)} · ${esc(r.category)} · ${esc(r.cuisine)}</p></div>${U.statusBadge(r)}</div>
          <p class="desc">${esc(r.description)}</p>
          ${r.photos && r.photos.length ? `<div class="thumbs">${r.photos.map(p => `<div class="thumb"><img src="${esc(p)}" alt=""></div>`).join("")}</div>` : ""}
          <dl class="kv">
            <dt>Plan</dt><dd>${esc(U.plan(r.plan).name)} (${esc(U.plan(r.plan).price)})</dd>
            <dt>Address</dt><dd>${esc(r.address)}, ${esc(r.area)}, ${esc(r.city)}, ${esc(r.governorate)}</dd>
            <dt>Map</dt><dd><a href="${esc(/^https?:/.test(r.maps_url) ? r.maps_url : "https://www.google.com/maps?q=" + encodeURIComponent(r.maps_url))}" target="_blank" rel="noopener">Open location ↗</a></dd>
            <dt>Contact</dt><dd>${esc(r.contact_phone)}</dd>
            <dt>Instagram</dt><dd><a href="https://instagram.com/${esc(r.instagram)}" target="_blank" rel="noopener">@${esc(r.instagram)}</a></dd>
            <dt>Website</dt><dd><a href="${esc(r.website)}" target="_blank" rel="noopener">${esc(r.website)}</a></dd>
            <dt>Owner</dt><dd>${esc(o.full_name || "")} · ${esc(o.email || "")}</dd>
            <dt>Owner phone</dt><dd>${esc(o.mobile || "")}${o.whatsapp ? ` · <a href="https://wa.me/${esc(o.whatsapp.replace(/\D/g, ""))}" target="_blank" rel="noopener">WhatsApp ${esc(o.whatsapp)}</a>` : ""}</dd>
            ${r.slug ? `<dt>Public URL</dt><dd><a href="${esc(U.profileHref(r.slug))}" target="_blank" rel="noopener">/restaurant/${esc(r.slug)}</a></dd>` : ""}
            ${r.reviewed_at ? `<dt>Reviewed</dt><dd>${U.dateTime(r.reviewed_at)}</dd>` : ""}
          </dl>
          ${r.status === "awaiting_verification" ? `<div class="alert info small">The owner hasn't confirmed their email yet, so this can't be reviewed.</div>` : `
          <div class="field"><label for="note">Note to the owner</label><textarea class="control" id="note" style="min-height:80px" placeholder="Optional when approving. Required when rejecting.">${esc(r.admin_note || "")}</textarea><span class="err">Tell the owner what to fix.</span></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-ok" id="ap" ${r.status === "approved" ? "disabled" : ""}>Approve &amp; publish</button><button class="btn btn-bad" id="rj" ${r.status === "rejected" ? "disabled" : ""}>Reject</button></div>
          <p class="small muted">The owner is emailed automatically.</p>`}
        </div>`;
        const act = async status => {
          const note = $("#note", el).value.trim();
          if (status === "rejected" && !note) return U.mark($("#note", el).closest(".field"), false);
          $("#ap", el).disabled = $("#rj", el).disabled = true;
          try { await A.decide(r.id, status, note); U.toast(status === "approved" ? `${r.name} approved. Its public page is live.` : `${r.name} rejected. The owner has been told why.`); views.applications(el, "applications-" + r.id); }
          catch (e) { U.toast(e.message, true); $("#ap", el).disabled = $("#rj", el).disabled = false; }
        };
        if ($("#ap", el)) { $("#ap", el).onclick = () => act("approved"); $("#rj", el).onclick = () => act("rejected"); }
      }
      if (current) { const r = rs.find(x => x.id === current); if (r) { filter = "all"; el.querySelectorAll("#flt button").forEach(x => x.setAttribute("aria-pressed", x.dataset.s === "all")); detail(r); } }
      list();
    },

    async restaurants(el) {
      const rs = (await A.restaurants()).filter(r => r.status === "approved");
      el.innerHTML = `<header><div><h1>Restaurants</h1><p class="muted">${rs.length} approved · ${rs.filter(r => r.published).length} live</p></div></header>` +
        (rs.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Restaurant</th><th>Owner</th><th>Plan</th><th>Location</th><th>Approved</th><th>Status</th><th></th></tr></thead><tbody>${rs.map(r => `<tr>
          <td><b>${esc(r.name)}</b><br><a class="small" href="${esc(U.profileHref(r.slug))}" target="_blank" rel="noopener">/restaurant/${esc(r.slug)}</a></td>
          <td>${esc((r.owner || {}).full_name || "")}<br><span class="small muted">${esc((r.owner || {}).email || "")}</span></td>
          <td>${esc(U.plan(r.plan).name)}</td><td>${esc(r.city)}</td><td class="num">${U.date(r.approved_at)}</td><td>${U.statusBadge(r)}</td>
          <td><button class="btn btn-line sm-btn" data-pub="${r.id}" data-to="${!r.published}">${r.published ? "Unpublish" : "Publish"}</button></td></tr>`).join("")}</tbody></table></div>`
          : `<div class="card empty"><b>No approved restaurants yet</b><a href="#applications">Review applications</a></div>`);
      el.querySelectorAll("[data-pub]").forEach(b => b.onclick = async () => { await A.setPublished(b.dataset.pub, b.dataset.to === "true"); U.toast(b.dataset.to === "true" ? "Published." : "Unpublished. The page is no longer public."); views.restaurants(el); });
    },

    async users(el) {
      const { us } = await badges();
      let filter = us.some(u => u.deletion_requested_at) ? "deletion" : "all";
      el.innerHTML = `<header><div><h1>Users</h1><p class="muted">${us.length} accounts. Roles can only be changed in the database (see SETUP.md).</p></div>
        <div class="tabs" id="uf">${[["all", "All"], ["customer", "Customers"], ["owner", "Owners"], ["admin", "Admins"], ["deletion", "Deletion requests"]].map(([k, l]) => `<button data-k="${k}" aria-pressed="${k === filter}">${l} <span class="muted">${k === "all" ? us.length : k === "deletion" ? us.filter(u => u.deletion_requested_at).length : us.filter(u => u.role === k).length}</span></button>`).join("")}</div></header><div id="ut"></div>`;
      function table() {
        const rows = us.filter(u => filter === "all" || (filter === "deletion" ? u.deletion_requested_at : u.role === filter));
        $("#ut", el).innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>Mobile</th><th>Role</th><th>Joined</th><th>Account</th></tr></thead><tbody>${rows.map(u => `<tr>
          <td><b>${esc(u.full_name || "—")}</b></td><td>${esc(u.email)}${u.email_confirmed === false ? ' <span class="chip">unverified</span>' : ""}</td><td>${esc(u.mobile || "—")}</td>
          <td><span class="chip ${u.role}">${u.role}</span></td><td class="num">${U.date(u.created_at)}</td>
          <td>${u.deletion_requested_at ? `<span class="chip del">Deletion requested ${U.date(u.deletion_requested_at)}</span>${u.deletion_reason ? `<br><span class="small muted">“${esc(u.deletion_reason)}”</span>` : ""}<div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-bad sm-btn" data-del="${u.id}">Delete account</button><button class="btn btn-line sm-btn" data-keep="${u.id}">Dismiss</button></div>` : (u.role === "admin" ? "" : `<button class="btn btn-line sm-btn" data-del="${u.id}">Delete</button>`)}</td></tr>`).join("")}</tbody></table></div>`
          : `<div class="card empty">No users here.</div>`;
        el.querySelectorAll("[data-del]").forEach(b => tap2(b, "Tap again: delete forever", async () => { await A.deleteUser(b.dataset.del); U.toast("Account deleted."); views.users(el); }));
        el.querySelectorAll("[data-keep]").forEach(b => b.onclick = async () => { await A.clearDeletion(b.dataset.keep); U.toast("Request dismissed."); views.users(el); });
      }
      $("#uf", el).onclick = e => { const b = e.target.closest("button"); if (!b) return; filter = b.dataset.k; el.querySelectorAll("#uf button").forEach(x => x.setAttribute("aria-pressed", x === b)); table(); };
      table();
    },

    async reviews(el) {
      const rows = await A.reviews();
      el.innerHTML = `<header><div><h1>Reviews</h1><p class="muted">${rows.length} reviews. Remove anything abusive, fake or off-topic.</p></div></header>` +
        (rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Restaurant</th><th>Rating</th><th>Review</th><th>By</th><th>Date</th><th></th></tr></thead><tbody>${rows.map(r => `<tr>
          <td>${r.restaurant ? `<a href="${esc(U.profileHref(r.restaurant.slug))}" target="_blank" rel="noopener">${esc(r.restaurant.name)}</a>` : "—"}</td><td><span class="stars">${U.stars(r.rating)}</span></td>
          <td style="max-width:360px">${esc(r.body)}</td><td>${esc(r.author_name || "")}</td><td class="num">${U.date(r.created_at)}</td>
          <td><button class="btn btn-bad sm-btn" data-rm="${r.id}">Remove</button></td></tr>`).join("")}</tbody></table></div>` : `<div class="card empty">No reviews yet.</div>`);
      el.querySelectorAll("[data-rm]").forEach(b => tap2(b, "Tap again to remove", async () => { await A.deleteReview(b.dataset.rm); U.toast("Review removed."); views.reviews(el); }));
    },

    async settings(el) {
      el.innerHTML = `<header><div><h1>Account settings</h1></div></header><div class="stack" id="st"></div>`;
      DineSettings.render($("#st", el), me, { onSaved: async () => { me = await api.me(); views.settings(el); } });
    }
  };
  U.tabs($("#nav"), $("#main"), views, "overview");
})();
</script>
</body>
</html>
