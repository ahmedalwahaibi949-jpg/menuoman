<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose a New Password · Dine Oman</title>
<meta name="theme-color" content="#0C3B3A">
<meta name="robots" content="noindex">
<link rel="icon" href="app-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/site-fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Reem+Kufi:wght@500..700&display=swap">
<link rel="stylesheet" href="css/do.css">
</head>
<body>
<header class="topbar"></header>
<main class="container" style="padding-block:56px;display:grid;justify-items:center">
  <div class="card auth-card" style="padding:32px">
    <div><h2>Choose a new password</h2><p class="lead">You'll use it to log in from now on.</p></div>
    <div class="alert bad" id="noSession" hidden>This reset link has expired or was already used. <a href="login.html#forgot">Request a new link</a>.</div>
    <form id="form" novalidate class="stack">
      <div class="field"><label for="password">New password</label><div class="pw"><input class="control" id="password" type="password" autocomplete="new-password"></div>
        <div class="meter" id="meter" data-s="0"><div class="bars"><i></i><i></i><i></i><i></i></div><span class="lbl">Use 8+ characters with letters and numbers</span></div>
        <span class="err">Use at least 8 characters, including letters and numbers.</span></div>
      <div class="field"><label for="confirm">Confirm new password</label><div class="pw"><input class="control" id="confirm" type="password" autocomplete="new-password"></div><span class="err">The passwords don't match.</span></div>
      <label class="check small"><input type="checkbox" id="everywhere" checked> <span>Log out of all other devices</span></label>
      <div class="alert bad" id="err" hidden></div>
      <button class="btn btn-dark" type="submit" id="submit">Save new password</button>
    </form>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script>
<script>
(async function () {
  const api = DineAPI, U = DineUI, $ = U.$;
  await U.chrome({ me: null, nav: false });
  U.bindPassword($("#password"), $("#meter")); U.bindPassword($("#confirm"));
  let s = null;
  for (let i = 0; i < 15 && !(s = await api.session()); i++) await new Promise(r => setTimeout(r, 150));
  if (!s) { $("#noSession").hidden = false; $("#form").hidden = true; return; }
  $("#form").addEventListener("submit", async e => {
    e.preventDefault(); $("#err").hidden = true;
    const pw = $("#password").value;
    const ok = U.mark($("#password").closest(".field"), U.V.password(pw)) & U.mark($("#confirm").closest(".field"), pw === $("#confirm").value);
    if (!ok) return;
    const btn = $("#submit"); U.busy(btn, true, "Saving…");
    try {
      await api.setNewPassword(pw);
      await api.signOut($("#everywhere").checked);
      location.replace("login.html?reset=1");
    } catch (err) { U.busy(btn, false); $("#err").hidden = false; $("#err").textContent = err.message; }
  });
})();
</script>
</body>
</html>
