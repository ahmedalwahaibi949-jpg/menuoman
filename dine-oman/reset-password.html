<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-en="New password · Dine Oman">كلمة مرور جديدة · داين عُمان</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="app-icon.svg" type="image/svg+xml">
<script src="js/lang.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="css/do.css">
</head>
<body>
<header class="top"></header>
<main class="wrap page"><div class="narrow form">
  <h1 class="title" data-en="Choose a new password">اختر كلمة مرور جديدة</h1>
  <div class="notice bad" id="noSession" hidden><span data-en="This link has expired or was already used.">انتهت صلاحية الرابط أو تم استخدامه.</span> <a href="login.html#forgot" data-en="Request a new one">اطلب رابطًا جديدًا</a></div>
  <form id="form" class="form" novalidate>
    <div class="field"><label for="password" data-en="New password">كلمة المرور الجديدة</label><div class="pw"><input class="input" id="password" type="password" autocomplete="new-password"></div><div class="meter" id="meter" data-s="0"><i></i><i></i><i></i><i></i></div><span class="err" data-en="At least 8 characters with letters and numbers.">8 أحرف على الأقل، تحتوي على حروف وأرقام.</span></div>
    <div class="field"><label for="confirm" data-en="Confirm new password">تأكيد كلمة المرور</label><div class="pw"><input class="input" id="confirm" type="password" autocomplete="new-password"></div><span class="err" data-en="The passwords don't match.">كلمتا المرور غير متطابقتين.</span></div>
    <label class="check"><input type="checkbox" id="everywhere" checked> <span data-en="Log out of all other devices">تسجيل الخروج من الأجهزة الأخرى</span></label>
    <div class="notice bad" id="err" hidden></div>
    <button class="btn block" type="submit" id="submit" data-en="Save password">حفظ كلمة المرور</button>
  </form>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script>
<script>
(async function () {
  const api = DineAPI, U = DineUI, $ = U.$;
  await U.chrome({ me: null, nav: false });
  U.bindPassword($("#password"), $("#meter")); U.bindPassword($("#confirm"));
  let s = null;
  for (let i = 0; i < 15 && !(s = await api.session()); i++) await new Promise(r => setTimeout(r, 150));
  if (!s) { $("#noSession").hidden = false; $("#form").hidden = true; return; }
  $("#form").addEventListener("submit", async e => {
    e.preventDefault(); $("#err").hidden = true;
    const pw = $("#password").value;
    const ok = U.mark($("#password").closest(".field"), U.V.password(pw)) & U.mark($("#confirm").closest(".field"), pw === $("#confirm").value);
    if (!ok) return;
    const btn = $("#submit"); U.busy(btn, true);
    try { await api.setNewPassword(pw); await api.signOut($("#everywhere").checked); location.replace("login.html?reset=1"); }
    catch (err) { U.busy(btn, false); $("#err").hidden = false; $("#err").textContent = err.message; }
  });
})();
</script>
</body>
</html>
