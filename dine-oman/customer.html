<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Account · Dine Oman</title>
<meta name="theme-color" content="#0C3B3A">
<meta name="robots" content="noindex">
<link rel="icon" href="app-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/site-fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Reem+Kufi:wght@500..700&display=swap">
<link rel="stylesheet" href="css/do.css">
<style>
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 20px;text-decoration:none;color:inherit;display:grid;gap:2px}
.tile:hover{border-color:#B9C7C0}
.tile span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile b{font-family:var(--f-display);font-size:34px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1}
.hello{background:var(--teal) var(--star);color:var(--sand);border-radius:var(--r-lg);padding:30px 32px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:18px}
.hello h1{font-size:clamp(28px,3.6vw,40px)}
.hello p{color:#C9D7D2}
.review{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:start;padding:18px 0;border-top:1px solid var(--line)}
.review:first-child{border-top:0}
.review img{width:52px;height:52px;border-radius:12px;object-fit:contain;border:1px solid var(--line);background:#fff}
.review p{margin-top:6px;font-size:15px}
.unfav{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--rose);font-size:18px;cursor:pointer;z-index:2}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 20px;margin:14px 0 0;font-size:15px}
.dl dt{color:var(--muted)}.dl dd{margin:0;overflow-wrap:anywhere}
@media (max-width:560px){.tiles{grid-template-columns:minmax(0,1fr)}.review{grid-template-columns:44px minmax(0,1fr)}.review>div:last-child{grid-column:2}}
</style>
</head>
<body>
<header class="topbar"></header>
<main class="container dash">
  <nav class="dash-nav" id="nav" aria-label="Account">
    <div class="who"><span class="avatar" id="av"></span><span style="min-width:0"><b id="whoName"></b><small>Customer</small></span></div>
    <a href="#profile" data-tab="profile">My profile</a>
    <a href="#favourites" data-tab="favourites">Favourite restaurants</a>
    <a href="#recent" data-tab="recent">Recently viewed</a>
    <a href="#reviews" data-tab="reviews">My reviews</a>
    <a href="#settings" data-tab="settings">Account settings</a>
  </nav>
  <section class="dash-main" id="main"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/settings.js"></script>
<script>
(async function () {
  const api = DineAPI, U = DineUI, $ = U.$, esc = U.esc;
  let me = await U.requireRole(["customer"]);
  await U.chrome({ me });
  const qs = new URLSearchParams(location.search);
  function who() { $("#whoName").textContent = me.full_name || me.email; $("#av").innerHTML = me.avatar_url ? `<img src="${esc(me.avatar_url)}" alt="">` : U.initials(me.full_name || me.email); }
  who();
  if (qs.has("welcome")) U.toast(`Welcome to Dine Oman${me.full_name ? ", " + me.full_name.split(" ")[0] : ""}!`);
  if (qs.has("emailchanged")) U.toast("Your email address is updated.");
  if (qs.has("denied")) U.toast("That page is only for restaurant owners or the Dine Oman team.", true);
  const refresh = async () => { me = await api.me(); who(); };

  const views = {
    async profile(el) {
      const [favs, recent, reviews] = await Promise.all([api.favourites(), api.recentlyViewed(), api.myReviews()]);
      el.innerHTML = `
        <div class="hello"><div><h1>Hello, ${esc((me.full_name || "there").split(" ")[0])}</h1><p>Find somewhere new tonight, or go back to a favourite.</p></div><a class="btn btn-primary" href="restaurants.html">Discover restaurants</a></div>
        ${!me.mobile ? `<div class="alert warn">Add your mobile number to complete your profile. <a href="#settings">Add it now</a></div>` : ""}
        <div class="tiles">
          <a class="tile" href="#favourites"><span>Favourites</span><b>${favs.length}</b></a>
          <a class="tile" href="#recent"><span>Recently viewed</span><b>${recent.length}</b></a>
          <a class="tile" href="#reviews"><span>Reviews written</span><b>${reviews.length}</b></a>
        </div>
        <div class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><h2>My profile</h2><a class="btn btn-line" href="#settings">Edit profile</a></div>
          <dl class="dl"><dt>Name</dt><dd>${esc(me.full_name || "Not set")}</dd><dt>Email</dt><dd>${esc(me.email)}</dd><dt>Mobile</dt><dd>${esc(me.mobile || "Not set")}</dd><dt>Member since</dt><dd>${U.date(me.created_at)}</dd><dt>Sign-in</dt><dd>${me.has_password ? "Email and password" : ""}${(me.providers || []).includes("google") ? (me.has_password ? " · " : "") + "Google" : ""}</dd></dl></div>
        ${recent.length ? `<div class="stack"><h2>Pick up where you left off</h2><div class="rgrid">${recent.slice(0, 3).map(v => U.rcard(v.restaurant)).join("")}</div></div>` : ""}`;
    },
    async favourites(el) {
      const favs = await api.favourites();
      el.innerHTML = `<header><div><h1>Favourite restaurants</h1><p class="muted">${favs.length} saved</p></div></header>` +
        (favs.length ? `<div class="rgrid">${favs.map(f => `<div style="position:relative">${U.rcard(f.restaurant, `Saved ${U.date(f.created_at)}`)}<button class="unfav" data-id="${f.restaurant.id}" aria-label="Remove ${esc(f.restaurant.name)} from favourites" title="Remove">♥</button></div>`).join("")}</div>`
          : `<div class="card empty"><b>No favourites yet</b><span>Tap the heart on any restaurant page to save it here.</span><a class="btn btn-dark" href="restaurants.html">Discover restaurants</a></div>`);
      el.querySelectorAll(".unfav").forEach(b => b.onclick = async () => { await api.setFavourite(b.dataset.id, false); U.toast("Removed from favourites."); views.favourites(el); });
    },
    async recent(el) {
      const rows = await api.recentlyViewed();
      el.innerHTML = `<header><div><h1>Recently viewed</h1><p class="muted">Restaurants you've opened, newest first.</p></div>${rows.length ? '<button class="btn btn-line" id="clear">Clear history</button>' : ""}</header>` +
        (rows.length ? `<div class="rgrid">${rows.map(v => U.rcard(v.restaurant, "Viewed " + U.dateTime(v.viewed_at))).join("")}</div>`
          : `<div class="card empty"><b>Nothing here yet</b><span>Restaurants you look at will appear here so you can find them again.</span><a class="btn btn-dark" href="restaurants.html">Start exploring</a></div>`);
      if ($("#clear", el)) $("#clear", el).onclick = async () => { await api.clearHistory(); U.toast("History cleared."); views.recent(el); };
    },
    async reviews(el) {
      const rows = await api.myReviews();
      el.innerHTML = `<header><div><h1>My reviews</h1><p class="muted">${rows.length} review${rows.length === 1 ? "" : "s"}</p></div></header>` +
        (rows.length ? `<div class="card">${rows.map(r => `<div class="review">
            <img src="${esc(r.restaurant ? r.restaurant.logo_url : "")}" alt="">
            <div style="min-width:0"><b>${r.restaurant ? `<a href="${esc(U.profileHref(r.restaurant.slug))}">${esc(r.restaurant.name)}</a>` : "Restaurant no longer listed"}</b>
              <div class="small muted"><span class="stars" aria-label="${r.rating} out of 5">${U.stars(r.rating)}</span> · ${U.date(r.created_at)}</div><p>${esc(r.body)}</p></div>
            <div style="display:flex;gap:8px">${r.restaurant ? `<a class="btn btn-line" style="padding:9px 14px;font-size:13.5px" href="${esc(U.profileHref(r.restaurant.slug))}#review">Edit</a>` : ""}<button class="btn btn-bad" style="padding:9px 14px;font-size:13.5px" data-del="${r.id}">Delete</button></div></div>`).join("")}</div>`
          : `<div class="card empty"><b>You haven't written a review yet</b><span>Share what you thought after your next meal. It helps other diners choose.</span></div>`);
      el.querySelectorAll("[data-del]").forEach(b => {
        b.onclick = async () => {
          if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Tap again to delete"; return; }
          await api.deleteReview(b.dataset.del); U.toast("Review deleted."); views.reviews(el);
        };
      });
    },
    async settings(el) {
      el.innerHTML = `<header><div><h1>Account settings</h1><p class="muted">Profile, login, security and your data.</p></div></header><div class="stack" id="st"></div>`;
      DineSettings.render($("#st", el), me, { onSaved: async () => { await refresh(); views.settings(el); } });
    }
  };
  U.tabs($("#nav"), $("#main"), views, "profile");
})();
</script>
</body>
</html>
