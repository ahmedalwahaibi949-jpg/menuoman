<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أدوات البيع · منيو عُمان</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Private sales tool: make a demo with the restaurant's own name, send it, and track who replied. */
:root{--bg:#FFFFFF;--bg-2:#F6F6F4;--fg:#111312;--muted:#6B706E;--line:#E7E8E6;--accent:#0C3B3A;--accent-h:#145650;--soft:#EEF3F2;--ok:#1F7A4D;--bad:#B42318;--f:"Tajawal","Segoe UI","Geeza Pro",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:17px;line-height:1.7}
h1,h2{margin:0;font-weight:800;line-height:1.25}
p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1040px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:40px 80px}
.muted{color:var(--muted)}.small{font-size:14.5px}.ltr{direction:ltr;unicode-bidi:isolate}
h1{font-size:clamp(28px,4.5vw,40px)}
.lead{color:var(--muted);font-size:18px;margin-top:6px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:44px;align-items:start;margin-top:32px}
.form{display:grid;gap:18px}
.field{display:grid;gap:6px;min-width:0}
.field label{font-weight:500;font-size:15.5px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.input{width:100%;min-height:50px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;font:400 16.5px var(--f);color:var(--fg);min-width:0}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
textarea.input{min-height:150px;line-height:1.65;resize:vertical}
.affix{display:flex;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;direction:ltr}
.affix span{display:flex;align-items:center;padding:0 14px;color:var(--muted);background:var(--bg-2);border-right:1px solid var(--line)}
.affix .input{border:0;border-radius:0;box-shadow:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;border:0;border-radius:10px;background:#128C4B;color:#fff;font:700 16.5px var(--f);cursor:pointer;text-decoration:none}
.btn:hover{background:#0F7A41}
.link{background:none;border:0;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
.link.plain{color:var(--muted);text-decoration:none}.link.danger{color:var(--bad)}
.acts{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.phone{width:100%;aspect-ratio:9/18.5;border-radius:32px;background:#111;padding:7px;position:sticky;top:20px}
.phone iframe{width:100%;height:100%;border:0;border-radius:26px;background:#000;display:block}
.urlbox{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;direction:ltr;overflow-wrap:anywhere;background:var(--bg-2);border-radius:10px;padding:12px 14px}
h2{font-size:24px;margin:56px 0 6px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--line);margin-top:16px}
.stats div{padding:16px 0}
.stats span{display:block;color:var(--muted);font-size:14px}
.stats b{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.row b{font-weight:700}
.row select{min-height:40px;padding:6px 10px;font-size:15px;width:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:#fff;padding:12px 20px;border-radius:10px;font-size:15.5px;z-index:9}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}.phone{position:static;max-width:240px;margin-inline:auto}.two{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:minmax(0,1fr) auto}}
</style>
</head>
<body>
<main class="wrap">
  <h1>أدوات البيع</h1>
  <p class="lead">اصنع نسخة تجريبية باسم المطعم، أرسلها على واتساب، وتابع من ردّ عليك.</p>

  <div class="cols">
    <div class="form">
      <div class="two">
        <div class="field"><label for="nAr">اسم المطعم بالعربي</label><input class="input" id="nAr" maxlength="40" placeholder="مثال: مقهى الواحة"></div>
        <div class="field"><label for="nEn">الاسم بالإنجليزي (اختياري)</label><input class="input ltr" id="nEn" maxlength="40" placeholder="Al Waha Café"></div>
      </div>
      <div class="two">
        <div class="field"><label for="cui">نوع المطعم</label><select class="input" id="cui"></select></div>
        <div class="field"><label for="des">التصميم</label><select class="input" id="des"></select></div>
      </div>
      <div class="field"><label>رابط النسخة التجريبية</label><div class="urlbox" id="url"></div></div>
      <div class="field"><label for="msg">الرسالة</label><textarea class="input" id="msg"></textarea></div>
      <div class="field"><label for="wa">واتساب المطعم (اختياري)</label><div class="affix"><span>+968</span><input class="input" id="wa" inputmode="numeric" maxlength="9" placeholder="9123 4567"></div></div>
      <div class="acts"><a class="btn" id="send" target="_blank" rel="noopener">إرسال على واتساب</a><button class="link" type="button" id="copy">نسخ الرسالة</button><button class="link plain" type="button" id="reset">إعادة كتابة الرسالة</button></div>
    </div>
    <div class="phone" aria-hidden="true"><iframe id="prev" title="معاينة"></iframe></div>
  </div>

  <h2>المتابعة</h2>
  <p class="muted">كل مطعم أرسلت له يُسجَّل هنا على هذا الجهاز. غيّر حالته عند الرد.</p>
  <div class="stats"><div><span>أُرسل لهم</span><b id="sSent">0</b></div><div><span>ردّوا</span><b id="sRep">0</b></div><div><span>اجتماع</span><b id="sMeet">0</b></div><div><span>دفعوا</span><b id="sPaid">0</b></div></div>
  <div id="rows"></div>
</main>
<script>
(async function () {
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const toast = m => { const e = document.createElement("div"); e.className = "toast"; e.textContent = m; document.body.appendChild(e); setTimeout(() => e.remove(), 2600); };
  const ALL = (await (await fetch("../menus/designs/index.json")).json()).filter(d => d.set === "interactive");
  const CUI = { cafe: "مقهى وحلويات", burger: "برغر ووجبات", grill: "مشويات", italian: "إيطالي وباستا", ramadan: "أطباق رمضانية" };
  $("#cui").innerHTML = Object.entries(CUI).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  function fillDesigns() { const c = $("#cui").value; $("#des").innerHTML = ALL.filter(d => d.cuisine === c).map(d => `<option value="${d.id}">${esc(d.name.ar)} · ${d.id}</option>`).join(""); }
  fillDesigns();

  const KEY = "menuoman-sales-v1";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } };
  const save = l => { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (e) {} };

  let edited = false, timer = null;
  const link = () => { const u = new URL("../menus/view.html", location.href); u.searchParams.set("id", $("#des").value); const a = $("#nAr").value.trim(), e = $("#nEn").value.trim(); if (a) u.searchParams.set("name", a); if (e) u.searchParams.set("name_en", e); return u.href; };
  const template = () => `السلام عليكم ورحمة الله 🌿
معك أحمد من منيو عُمان. أصمم منيو QR تفاعلي للمطاعم والمقاهي: الزبون يمسح الكود ويشوف الأطباق تتحرك قبل ما يطلب.

جهّزت نسخة تجريبية باسم ${$("#nAr").value.trim() || "مطعمكم"}، تقدر تفتحها من هاتفك:
${link()}

الأطباق في النسخة للتجربة فقط، وأحط أطباقكم وأسعاركم وصوركم. إذا أعجبتكم أرسل لكم التفاصيل والسعر.`;
  function update() {
    $("#url").textContent = link();
    if (!edited) $("#msg").value = template();
    const n = $("#wa").value.replace(/\D/g, "").replace(/^968/, "");
    $("#send").href = "https://wa.me/" + (n.length === 8 ? "968" + n : "") + "?text=" + encodeURIComponent($("#msg").value);
    clearTimeout(timer); timer = setTimeout(() => { $("#prev").src = link(); }, 500);
  }
  ["#nAr", "#nEn", "#wa"].forEach(s => $(s).addEventListener("input", update));
  $("#cui").onchange = () => { fillDesigns(); update(); };
  $("#des").onchange = update;
  $("#msg").addEventListener("input", () => { edited = true; update(); });
  $("#reset").onclick = () => { edited = false; update(); };
  $("#copy").onclick = async () => { try { await navigator.clipboard.writeText($("#msg").value); toast("تم نسخ الرسالة"); } catch (e) { $("#msg").select(); } };
  $("#send").addEventListener("click", () => {
    const name = $("#nAr").value.trim(); if (!name) return;
    const l = load(); if (!l.some(x => x.name === name)) { l.unshift({ id: Date.now(), name, design: $("#des").value, link: link(), status: "sent", at: new Date().toISOString() }); save(l); }
    setTimeout(draw, 300);
  });

  const ST = { sent: "أُرسل", replied: "ردّ", meeting: "اجتماع", paid: "دفع", no: "غير مهتم" };
  function draw() {
    const l = load(), c = s => l.filter(x => x.status === s).length;
    $("#sSent").textContent = l.length; $("#sRep").textContent = c("replied") + c("meeting") + c("paid"); $("#sMeet").textContent = c("meeting") + c("paid"); $("#sPaid").textContent = c("paid");
    $("#rows").innerHTML = l.length ? l.map(x => `<div class="row"><div style="min-width:0"><b>${esc(x.name)}</b><div class="small muted"><span class="ltr">${esc(x.design)}</span> · ${new Date(x.at).toLocaleDateString("ar-OM", { day: "numeric", month: "short", numberingSystem: "latn" })} · <a class="link" href="${esc(x.link)}" target="_blank" rel="noopener">النسخة</a></div></div>
      <select class="input" data-id="${x.id}" aria-label="الحالة">${Object.entries(ST).map(([k, v]) => `<option value="${k}" ${x.status === k ? "selected" : ""}>${v}</option>`).join("")}</select>
      <button class="link danger small" data-del="${x.id}" type="button">حذف</button></div>`).join("") : `<p class="muted" style="padding:20px 0">لم ترسل لأحد بعد. الهدف: 30 مطعمًا هذا الشهر.</p>`;
    document.querySelectorAll("#rows select").forEach(s => s.onchange = () => { const l2 = load(); const x = l2.find(y => String(y.id) === s.dataset.id); if (x) { x.status = s.value; save(l2); draw(); } });
    document.querySelectorAll("#rows [data-del]").forEach(b => b.onclick = () => { save(load().filter(y => String(y.id) !== b.dataset.del)); draw(); });
  }
  update(); draw();
})();
</script>
</body>
</html>
