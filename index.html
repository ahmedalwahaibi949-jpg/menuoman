*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#15122B;--sun:#FFB81C;--line:rgba(255,255,255,.16)}
html,body{height:100%}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--ink);color:#fff;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.logo{font:700 20px 'Reem Kufi';color:var(--sun)}
.tabs{display:flex;background:rgba(255,255,255,.1);border-radius:30px;padding:3px}
.tab{font:inherit;font-weight:600;font-size:14px;color:#fff;background:none;border:0;padding:6px 16px;border-radius:30px;cursor:pointer}
.tab.on{background:var(--sun);color:var(--ink)}
.wa{background:var(--sun);color:var(--ink);font-weight:700;font-size:14px;padding:8px 16px;border-radius:30px;text-decoration:none;white-space:nowrap}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px}
#box{position:relative;overflow:hidden;background:#000;box-shadow:0 0 0 8px #2a2650,0 20px 60px rgba(0,0,0,.5)}
#box.qr{border-radius:30px}
#box.tv{border-radius:12px}
#fr{position:absolute;top:0;right:0;border:0;transform-origin:top right;transition:opacity .3s}
#fr.out{opacity:0}
.ring{position:absolute;right:50%;top:56%;width:80px;height:80px;margin:-40px -40px 0 0;border-radius:50%;border:3px solid #fff;pointer-events:none;animation:ping 1.5s ease-out 3}
@keyframes ping{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.5);opacity:0}}
footer{flex:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;justify-content:center;overflow-x:auto}
.chip{font:inherit;font-weight:600;font-size:14px;color:#fff;background:none;border:1.5px solid var(--line);padding:7px 16px;border-radius:30px;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--sun);color:var(--sun)}
@media(max-width:520px){.logo{display:none}header{justify-content:space-between}#box{box-shadow:0 0 0 5px #2a2650}}
@media(prefers-reduced-motion:reduce){.ring{animation:none;opacity:0}#fr{transition:none}}

.glow{position:fixed;top:50%;left:50%;width:min(80vw,760px);height:min(80vw,760px);margin:calc(min(80vw,760px)/-2);border-radius:50%;filter:blur(110px);opacity:.55;background:var(--gl);transition:background .9s;pointer-events:none;z-index:0}
header,main,footer{position:relative;z-index:1}
main{perspective:1200px;gap:6vw}
#wrap{transition:transform .25s ease-out;transform-style:preserve-3d}
#box.qr::before{content:"";position:absolute;top:9px;left:50%;width:70px;height:20px;margin-left:-35px;border-radius:12px;background:#0c0a1d;z-index:3;pointer-events:none}
.pitch{display:none;max-width:360px}
.pitch h1{font:700 clamp(40px,4.6vw,64px)/1.15 'Reem Kufi';margin-bottom:14px}
.pitch h1 em{font-style:normal;color:var(--sun)}
.pitch p{font-size:18px;opacity:.8;margin-bottom:26px}
.scan{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.scan svg{width:92px;height:92px;border-radius:8px;flex:none}
.scan b{display:block;font-size:16px}.scan span{font-size:13.5px;opacity:.7}
@media(min-width:1000px){.pitch{display:block}}
