<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>منيو عُمان · منيو QR تفاعلي</title><meta name="description" content="منيو QR يتحرك ويتفاعل مع كل ضغطة. جرّبه الحين."><meta name="theme-color" content="#15122B">
<link rel="stylesheet" href="tsk/assets/fonts.css"><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#15122B;--sun:#FFB81C;--line:rgba(255,255,255,.16)}
html,body{height:100%}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--ink);color:#fff;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.logo{font:700 20px 'Reem Kufi';color:var(--sun)}
.tabs{display:flex;background:rgba(255,255,255,.1);border-radius:30px;padding:3px}
.tab{font:inherit;font-weight:600;font-size:14px;color:#fff;background:none;border:0;padding:6px 16px;border-radius:30px;cursor:pointer}
.tab.on{background:var(--sun);color:var(--ink)}
.wa{background:var(--sun);color:var(--ink);font-weight:700;font-size:14px;padding:8px 16px;border-radius:30px;text-decoration:none;white-space:nowrap}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px}
#box{position:relative;overflow:hidden;background:#000;box-shadow:0 0 0 8px #2a2650,0 20px 60px rgba(0,0,0,.5)}
#box.qr{border-radius:30px}
#box.tv{border-radius:12px}
#fr{position:absolute;top:0;right:0;border:0;transform-origin:top right;transition:opacity .3s}
#fr.out{opacity:0}
.ring{position:absolute;right:50%;top:56%;width:80px;height:80px;margin:-40px -40px 0 0;border-radius:50%;border:3px solid #fff;pointer-events:none;animation:ping 1.5s ease-out 3}
@keyframes ping{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.5);opacity:0}}
footer{flex:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;justify-content:center;overflow-x:auto}
.chip{font:inherit;font-weight:600;font-size:14px;color:#fff;background:none;border:1.5px solid var(--line);padding:7px 16px;border-radius:30px;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--sun);color:var(--sun)}
@media(max-width:520px){.logo{display:none}header{justify-content:space-between}#box{box-shadow:0 0 0 5px #2a2650}}
@media(prefers-reduced-motion:reduce){.ring{animation:none;opacity:0}#fr{transition:none}}
</style></head><body>
<header><span class="logo">منيو عُمان</span>
<div class="tabs" role="tablist"><button class="tab on" data-m="qr" role="tab">منيو QR</button><button class="tab" data-m="tv" role="tab">شاشة TV</button></div>
<a class="wa" id="wa" href="#">أبي منيو لمطعمي</a></header>
<main><div id="box" class="qr"><iframe id="fr" title="عيّنة المنيو التفاعلي" src="tsk/qr/1/"></iframe><span class="ring" id="ring"></span></div></main>
<footer role="group" aria-label="نمط المنيو"><button class="chip on" data-n="1">إديتوريال</button><button class="chip" data-n="2">بوستر</button><button class="chip" data-n="3">الألوان المتحولة</button><button class="chip" data-n="4">الأطباق الدائرية</button><button class="chip" data-n="5">المدار</button></footer>
<script>
const box=document.getElementById('box'),fr=document.getElementById('fr'),main=document.querySelector('main');
let mode='qr',n=1;
const D={qr:[390,800],tv:[1920,1080]};
function fit(){const [w,h]=D[mode],aw=main.clientWidth-28,ah=main.clientHeight-28;const s=Math.min(aw/w,ah/h);box.style.width=w*s+'px';box.style.height=h*s+'px';fr.style.width=w+'px';fr.style.height=h+'px';fr.style.transform='scale('+s+')'}
function load(){fr.classList.add('out');setTimeout(()=>{fr.onload=()=>fr.classList.remove('out');fr.src='tsk/'+mode+'/'+n+'/'},250)}
addEventListener('resize',fit);
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const v=+c.dataset.n;if(v===n)return;n=v;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));load()});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{if(t.dataset.m===mode)return;mode=t.dataset.m;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));box.className=mode;document.getElementById('ring').style.display=mode==='qr'?'':'none';fit();load()});
document.getElementById('wa').href='https://wa.me/96895989547?text='+encodeURIComponent('السلام عليكم، شفت المنيو التفاعلي وأبي منيو لمطعمي.');
fit();
</script></body></html>
