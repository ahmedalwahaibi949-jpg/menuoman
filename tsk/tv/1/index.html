const LOGO='../../assets/logo.png',MARKC='../../assets/mark_cream.png',MARKW='../../assets/mark_wine.png';
const ty=(t,d)=>[...t].map((ch,i)=>`<span style="--i:${i}">${ch===' '?'&nbsp;':ch}</span>`).join('');
const APP=$('#app'),TVS=$('#tvs');
let Z=1,H=844;
function fit(){
 if(TV){const s=Math.min(innerWidth/1920,innerHeight/1080);TVS.style.transform='scale('+s+')';return}
 Z=Math.min(innerWidth,480)/390;H=innerHeight/Z;
 APP.style.height=H+'px';APP.style.transform='scale('+Z+')';APP.style.left=((innerWidth-390*Z)/2)+'px';
 document.documentElement.style.setProperty('--H',H+'px');document.documentElement.style.setProperty('--k',Math.min(1,H/820));document.documentElement.dataset.sh=H<760?'1':'0';
}
fit();addEventListener('resize',fit);
const ROOT=TV?TVS:APP;
function wm(){let r='';const n=TV?9:11;for(let i=0;i<n;i++)r+=`<i style="top:${i*(TV?130:90)-30}px">نموذج تجريبي · DEMO · نموذج تجريبي · DEMO · نموذج تجريبي</i>`;return `<div class="wm">${r}<b>DEMO</b></div>`}
function toast(t){let e=$('.toast');if(!e){e=document.createElement('div');e.className='toast';ROOT.appendChild(e)}e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}
/* ---------- order bag (QR) ---------- */
const Bag={m:{},btn:null,mount(css){
  const b=document.createElement('button');b.className='bagb';b.setAttribute('aria-label','طلبي');b.style.cssText=css||'top:14px;right:14px';
  b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><em>0</em>';
  APP.appendChild(b);this.btn=b;b.onclick=()=>this.open();
  const s=document.createElement('div');s.className='sheet';s.innerHTML='<div class="pn"></div>';APP.appendChild(s);this.sh=s;
  s.addEventListener('click',e=>{if(e.target===s)this.close();const a=e.target.closest('[data-q]');if(a){this.chg(a.dataset.k,+a.dataset.q)}if(e.target.closest('[data-x]'))this.close();if(e.target.closest('.go')){this.close();this.m={};this.upd();toast('تم إرسال الطلب (نموذج تجريبي) ✓')}});
 },
 count(){return Object.values(this.m).reduce((a,b)=>a+b,0)},
 total(){return Object.entries(this.m).reduce((a,[k,q])=>a+BY[k].num*q,0)},
 add(k,from){this.m[k]=(this.m[k]||0)+1;if(from)this.fly(from,k);else this.upd(1)},
 chg(k,n){this.m[k]=(this.m[k]||0)+n;if(this.m[k]<=0)delete this.m[k];this.upd();this.render()},
 upd(b){const n=this.count();const e=$('em',this.btn);e.textContent=n;this.btn.classList.toggle('has',n>0);if(b){this.btn.classList.remove('bump');void this.btn.offsetWidth;this.btn.classList.add('bump')}},
 fly(from,k){const a=APP.getBoundingClientRect(),r=from.getBoundingClientRect(),t=this.btn.getBoundingClientRect();
  const f=document.createElement('img');f.className='fly';f.src=BY[k].src;const w=54;
  const x0=(r.left+r.width/2-a.left)/Z-w/2,y0=(r.top+r.height/2-a.top)/Z-w/2,x1=(t.left+t.width/2-a.left)/Z-w/2,y1=(t.top+t.height/2-a.top)/Z-w/2;
  f.style.cssText=`left:0;top:0;width:${w}px;height:${w}px`;APP.appendChild(f);
  const an=f.animate([{transform:`translate(${x0}px,${y0}px) scale(1.3)`,opacity:1},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-60}px) scale(1)`,opacity:1,offset:.5},{transform:`translate(${x1}px,${y1}px) scale(.3)`,opacity:.4}],{duration:750,easing:'cubic-bezier(.5,0,.3,1)',fill:'forwards'});
  an.onfinish=()=>{f.remove();this.upd(1)}},
 open(){this.render();this.sh.classList.add('on')},close(){this.sh.classList.remove('on')},
 render(){const ks=Object.keys(this.m);$('.pn',this.sh).innerHTML=`<h3><span>طلبي</span><button data-x aria-label="إغلاق">×</button></h3>`+(ks.length?ks.map(k=>`<div class="rw"><img src="${BY[k].src}" alt=""><div>${BY[k].ar}<small>${BY[k].en}</small></div><div class="q"><button data-q="-1" data-k="${k}">−</button><b>${this.m[k]}</b><button data-q="1" data-k="${k}">+</button></div></div>`).join('')+`<div class="tot"><span>المجموع التقريبي</span><span><bdi>${this.total().toFixed(3)}</bdi> ر.ع</span></div><button class="go">إرسال الطلب</button>`:'<div class="em">لم تضف أي طبق بعد</div>')}
};
/* ---------- TV player ---------- */
function tvPlay(seq){let i=0,cur=null;
 (function next(){const s=seq[i%seq.length];i++;const el=document.createElement('div');el.className='scene '+(s.cls||'');el.innerHTML=s.html;TVS.insertBefore(el,$('.wm',TVS));
  requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.add('in');el.firstElementChild&&el.firstElementChild.classList.add('in')}));
  if(cur){const o=cur;o.classList.add('out');setTimeout(()=>o.remove(),s.x||1200)}
  cur=el;setTimeout(next,s.dur)})();
}
function mountWm(){ROOT.insertAdjacentHTML('beforeend',wm())}
window.__ready=0;

function scene(d,i){
 const alt=d.i%2;
 if(!alt) return `<div class="sa"><div class="lab en">${d.cat.en.toUpperCase()} · ${d.n}</div><i class="ln"></i>
  <h1 class="hl en ty">${ty(d.en.toUpperCase())}</h1>
  <div class="card"><svg class="rg" viewBox="0 0 400 400"><circle cx="200" cy="200" r="150" pathLength="1"/><circle cx="200" cy="200" r="170" pathLength="1"/></svg><img class="dish" src="${d.src}" alt="${d.en}"></div>
  <div class="pr en"><small>OMR</small><b><bdi>${d.p}</bdi></b></div>
  <div class="dsc"><b>${d.ar}</b><span>${d.dar}</span></div>${TV?'<img class="mk" src="'+MARKC+'" alt="">':''}</div>`;
 const tt=(c)=>`<div class="hl en">${c}</div>`;
 const two=(cls,inner)=>`<div class="two ${cls}"><div class="la">${inner}</div><div class="lb" aria-hidden="true">${inner}</div></div>`;
 return `<div class="sb"><i class="band"></i>
  ${two('t1','<h1 class="hl en ty">'+ty(d.en.toUpperCase())+'</h1>')}
  ${two('t2','<span class="a">'+d.ar+'</span>')}
  <div class="no en">#${d.n}</div>
  <div class="stk"><img src="${d.src}" alt=""><img src="${d.src}" alt=""><img src="${d.src}" alt=""></div>
  ${two('t3','<div class="pr en"><small>OMR</small><b><bdi>'+d.p+'</bdi></b></div>')}
  ${TV?'<div class="pd"><div class="dsc"><span>'+d.dar+'</span></div></div>':''}</div>`;
}
if(!TV){
 APP.innerHTML=`<div id="feed">${D.map(d=>`<section class="sl" data-i="${d.i}">${scene(d)}<button class="addb" data-k="${d.k}"><span>أضف</span><b>+</b></button>${d.i===0?'<i class="hint"></i>':''}</section>`).join('')}</div>
 <div class="bar"><img class="mk2" src="${MARKC}" alt=""><div class="tabs">${C.map((c,i)=>`<button data-c="${i}" class="${i?'':'on'}">${c.ar}</button>`).join('')}</div></div>`;
 mountWm();Bag.mount('top:12px;right:12px;z-index:60');
 const feed=$('#feed'),sls=$$('.sl'),tabs=$$('.tabs button');let cur=-1;
 function act(i){if(i===cur)return;cur=i;sls.forEach((s,j)=>s.classList.toggle('in',j===i));const sc=sls[i].firstElementChild;sls[i].firstElementChild.classList.add('in');sls.forEach((s,j)=>{if(j!==i)s.firstElementChild.classList.remove('in')});
  APP.dataset.tone=D[i].i%2?'light':'dark';tabs.forEach((b,k)=>{const on=+b.dataset.c===D[i].c;b.classList.toggle('on',on);if(on)b.parentNode.scrollTo({left:b.offsetLeft-60,behavior:'smooth'})})}
 feed.addEventListener('scroll',()=>act(Math.max(0,Math.min(D.length-1,Math.round(feed.scrollTop/H)))),{passive:true});
 tabs.forEach(b=>b.onclick=()=>{const i=C[+b.dataset.c].items[0].i;feed.scrollTo({top:i*H,behavior:'smooth'})});
 feed.addEventListener('click',e=>{const a=e.target.closest('.addb');if(a)Bag.add(a.dataset.k,a)});
 addEventListener('resize',()=>{feed.scrollTop=Math.max(0,cur)*H});
 act(0);
}else{
 mountWm();
 const seq=[{cls:'',html:`<div class="sa in"><div class="lab en" style="top:430px;left:0;right:0;text-align:center;font-size:24px">THE SOCIAL KITCHEN</div><img src="${LOGO}" style="position:absolute;left:810px;top:150px;width:300px;border-radius:50%" alt=""><h1 class="en" style="position:absolute;left:0;right:0;top:520px;text-align:center;font:500 150px 'Playfair Display';letter-spacing:.2em">MENU</h1></div>`,dur:3200}];
 D.forEach(d=>seq.push({html:scene(d),dur:5600,cls:d.i%2?'sbw':''}));
 tvPlay(seq);
}

window.__ready=1;</script></body></html>
