 Z=Math.min(innerWidth,480)/390;H=innerHeight/Z;
 APP.style.height=H+'px';APP.style.transform='scale('+Z+')';APP.style.left=((innerWidth-390*Z)/2)+'px';
 document.documentElement.style.setProperty('--H',H+'px');document.documentElement.style.setProperty('--k',Math.min(1,H/820));document.documentElement.dataset.sh=H<760?'1':'0';
}
fit();addEventListener('resize',fit);
const ROOT=TV?TVS:APP;
function wm(){let r='';const n=TV?9:11;for(let i=0;i<n;i++)r+=`<i style="top:${i*(TV?130:90)-30}px">نموذج تجريبي · DEMO · نموذج تجريبي · DEMO · نموذج تجريبي</i>`;return `<div class="wm">${r}<b>DEMO</b></div>`}
function toast(t){let e=$('.toast');if(!e){e=document.createElement('div');e.className='toast';ROOT.appendChild(e)}e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}
/* ---------- order bag (QR) ---------- */
const Bag={m:{},btn:null,mount(css){
  const b=document.createElement('button');b.className='bagb';b.setAttribute('aria-label','طلبي');b.style.cssText=css||'top:14px;right:14px';
  b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><em>0</em>';
  APP.appendChild(b);this.btn=b;b.onclick=()=>this.open();
  const s=document.createElement('div');s.className='sheet';s.innerHTML='<div class="pn"></div>';APP.appendChild(s);this.sh=s;
  s.addEventListener('click',e=>{if(e.target===s)this.close();const a=e.target.closest('[data-q]');if(a){this.chg(a.dataset.k,+a.dataset.q)}if(e.target.closest('[data-x]'))this.close();if(e.target.closest('.go')){this.close();this.m={};this.upd();toast('تم إرسال الطلب (نموذج تجريبي) ✓')}});
 },
 count(){return Object.values(this.m).reduce((a,b)=>a+b,0)},
 total(){return Object.entries(this.m).reduce((a,[k,q])=>a+BY[k].num*q,0)},
 add(k,from){this.m[k]=(this.m[k]||0)+1;if(from)this.fly(from,k);else this.upd(1)},
 chg(k,n){this.m[k]=(this.m[k]||0)+n;if(this.m[k]<=0)delete this.m[k];this.upd();this.render()},
 upd(b){const n=this.count();const e=$('em',this.btn);e.textContent=n;this.btn.classList.toggle('has',n>0);if(b){this.btn.classList.remove('bump');void this.btn.offsetWidth;this.btn.classList.add('bump')}},
 fly(from,k){const a=APP.getBoundingClientRect(),r=from.getBoundingClientRect(),t=this.btn.getBoundingClientRect();
  const f=document.createElement('img');f.className='fly';f.src=BY[k].src;const w=54;
  const x0=(r.left+r.width/2-a.left)/Z-w/2,y0=(r.top+r.height/2-a.top)/Z-w/2,x1=(t.left+t.width/2-a.left)/Z-w/2,y1=(t.top+t.height/2-a.top)/Z-w/2;
  f.style.cssText=`left:0;top:0;width:${w}px;height:${w}px`;APP.appendChild(f);
  const an=f.animate([{transform:`translate(${x0}px,${y0}px) scale(1.3)`,opacity:1},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-60}px) scale(1)`,opacity:1,offset:.5},{transform:`translate(${x1}px,${y1}px) scale(.3)`,opacity:.4}],{duration:750,easing:'cubic-bezier(.5,0,.3,1)',fill:'forwards'});
  an.onfinish=()=>{f.remove();this.upd(1)}},
 open(){this.render();this.sh.classList.add('on')},close(){this.sh.classList.remove('on')},
 render(){const ks=Object.keys(this.m);$('.pn',this.sh).innerHTML=`<h3><span>طلبي</span><button data-x aria-label="إغلاق">×</button></h3>`+(ks.length?ks.map(k=>`<div class="rw"><img src="${BY[k].src}" alt=""><div>${BY[k].ar}<small>${BY[k].en}</small></div><div class="q"><button data-q="-1" data-k="${k}">−</button><b>${this.m[k]}</b><button data-q="1" data-k="${k}">+</button></div></div>`).join('')+`<div class="tot"><span>المجموع التقريبي</span><span><bdi>${this.total().toFixed(3)}</bdi> ر.ع</span></div><button class="go">إرسال الطلب</button>`:'<div class="em">لم تضف أي طبق بعد</div>')}
};
/* ---------- TV player ---------- */
function tvPlay(seq){let i=0,cur=null;
 (function next(){const s=seq[i%seq.length];i++;const el=document.createElement('div');el.className='scene '+(s.cls||'');el.innerHTML=s.html;TVS.insertBefore(el,$('.wm',TVS));
  requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.add('in');el.firstElementChild&&el.firstElementChild.classList.add('in')}));
  if(cur){const o=cur;o.classList.add('out');setTimeout(()=>o.remove(),s.x||1200)}
  cur=el;setTimeout(next,s.dur)})();
}
function mountWm(){ROOT.insertAdjacentHTML('beforeend',wm())}
window.__ready=0;

const FR=['#601825','#b8924a','#6f8a6a','#c4623b','#26324f'];
const tl=(d,i)=>`<button class="tl" data-k="${d.k}" style="--f:${FR[d.c]};--i:${i||0}"><img src="${d.src}" alt=""><b class="en">${d.en}</b><span class="a">${d.ar}</span><i class="p en"><bdi>${d.p}</bdi></i></button>`;
function title(d){const w=d.en.split(' ');const last=w.pop();return `<h2 class="tt"><span class="o">${w.join(' ')}</span><i class="en l">${last}</i></h2>`}
const bigW=(t)=>[...t].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('');
function zoomHTML(d,tv){return `<div class="${tv?'tv-z':'dvi'}" style="--f:${FR[d.c]}">${tv?`<div class="fr"></div><div class="num">#${d.n}</div>`:'<button class="bk" aria-label="رجوع">‹</button>'}${title(d)}
 <div class="pic">${tv?'':'<i class="fr"></i>'}<img src="${d.src}" alt="${d.en}"></div>
 <div class="inf"><div class="pz en"><small>OMR</small><b><bdi>${d.p}</bdi></b></div><p class="ds"><b>${d.ar}</b>${d.dar}<em class="en">${d.den}</em></p></div>
 ${tv?'':`<button class="addb" data-k="${d.k}">أضف إلى طلبي +</button>`}
 <div class="mini">${d.cat.items.map(x=>`<button data-k="${x.k}" class="${x===d?'on':''}"><img src="${x.src}" alt=""></button>`).join('')}</div></div>`}
if(!TV){
 APP.innerHTML=`<div class="sc" id="sc" style="position:absolute;inset:0"><header class="hero"><img class="mk" src="${MARKW}" alt=""><h1 class="big en">${bigW('MENU')}</h1><p class="sub en">The Social Kitchen</p><p class="sub2">اضغط على أي طبق لتراه بالتفصيل</p></header>
 ${C.map((c,ci)=>`<section><h3 class="chd" style="--f:${FR[ci]}"><i class="en">${c.en}</i><b>${c.ar}</b></h3><div class="g">${c.items.map(d=>tl(d)).join('')}</div></section>`).join('')}<div class="ft2">الأسعار بالريال العُماني · نموذج تجريبي</div></div><div id="dv"></div>`;
 mountWm();Bag.mount('top:12px;right:12px;z-index:60');
 const sc=$('#sc'),dv=$('#dv');let cur=null,busy=0;
 requestAnimationFrame(()=>requestAnimationFrame(()=>$('.hero').classList.add('in')));
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{root:sc,rootMargin:'0px 0px -6% 0px'});
 $$('.tl').forEach(t=>io.observe(t));
 function paint(d){dv.innerHTML=zoomHTML(d);dv.classList.remove('in');void dv.offsetWidth;requestAnimationFrame(()=>requestAnimationFrame(()=>dv.classList.add('in')))}
 const rect=el=>{const a=APP.getBoundingClientRect(),r=el.getBoundingClientRect();return{x:(r.left-a.left)/Z,y:(r.top-a.top)/Z,w:r.width/Z,h:r.height/Z}};
 const clip=r=>`inset(${r.y}px ${390-r.x-r.w}px ${H-r.y-r.h}px ${r.x}px round 14px)`;
 function open(k,tile){if(busy||cur)return;busy=1;cur=k;paint(BY[k]);dv.classList.add('on');history.pushState({d:1},'','#'+k);
  const a=dv.animate([{clipPath:clip(rect(tile))},{clipPath:`inset(0px 0px 0px 0px round 0px)`}],{duration:620,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'});a.onfinish=()=>{busy=0}}
 function close(){if(!cur)return;busy=1;const tile=$(`.tl[data-k="${cur}"]`);const r=rect(tile);cur=null;
  const a=dv.animate([{clipPath:`inset(0px 0px 0px 0px round 0px)`},{clipPath:clip(r)}],{duration:520,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'});a.onfinish=()=>{dv.classList.remove('on');a.cancel();busy=0}}
 sc.addEventListener('click',e=>{const t=e.target.closest('.tl');if(t)open(t.dataset.k,t)});
 dv.addEventListener('click',e=>{if(e.target.closest('.bk'))return history.state&&history.state.d?history.back():close();const a=e.target.closest('.addb');if(a)return Bag.add(a.dataset.k,a);const m=e.target.closest('.mini button');if(m&&m.dataset.k!==cur){cur=m.dataset.k;paint(BY[cur]);history.replaceState({d:1},'','#'+cur)}});
 addEventListener('popstate',()=>{if(cur)close()});
 window._api={open:k=>open(k,$(`.tl[data-k="${k}"]`)),close,state:()=>({cur,busy})};
}else{
 mountWm();
 const gridHTML=c=>`<div class="tv-l" style="--f:${FR[C.indexOf(c)]}"><img class="mk" src="${MARKW}" alt=""><h1 class="big en">${bigW('MENU')}</h1><div class="cn">${c.en}</div><div class="ca">${c.ar}</div></div><div class="tv-g c${c.items.length}">${c.items.map((d,i)=>tl(d,i)).join('')}</div>`;
 const seq=[{cls:'gs',dur:3400,html:`<div class="tv-l" style="left:0;right:0;width:auto;align-items:center;--f:#601825"><img class="mk" src="${LOGO}" style="width:170px;border-radius:50%" alt=""><h1 class="big en" style="font-size:480px;justify-content:center;-webkit-text-stroke:7px var(--ink)">${bigW('MENU')}</h1><div class="cn" style="font-size:70px">The Social Kitchen</div></div>`}];
 C.forEach(c=>{seq.push({cls:'gs',dur:3000,html:gridHTML(c)});c.items.forEach(d=>seq.push({cls:'zs',dur:4800,x:1500,html:zoomHTML(d,true)}))});
 tvPlay(seq);
}

window.__ready=1;</script></body></html>
